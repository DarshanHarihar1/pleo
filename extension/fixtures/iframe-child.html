<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pleo iframe child form</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
      }
      label {
        display: block;
        margin: 0.5rem 0 0.2rem;
      }
    </style>
  </head>
  <body>
    <h2>Iframe application</h2>
    <form>
      <label for="iframe-fn">First Name</label>
      <input id="iframe-fn" name="first_name" type="text" />

      <label for="iframe-em">Email Address</label>
      <input id="iframe-em" name="email" type="email" />
    </form>
  </body>
</html>
